apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-webapp
  template:
    metadata:
      labels:
        app: devops-webapp
    spec:
      containers:
        - name: webapp
          image: devops-webapp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
